<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Family Management</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>


    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="../index.html" class="logo">
                Relief Camp Management
            </a>


            <div class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="camps.html">
                    Camps
                </a>

                <a href="family.html" class="active">
                    Families
                </a>

                <a href="supplies.html">
                    Supplies
                </a>

                <a href="distribution.html">
                    Distribution
                </a>

            </div>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="page-container">


        <!-- Back to Dashboard -->

        <a href="../index.html" class="back-link">
            ← Back to Dashboard
        </a>


        <!-- Page Title -->

        <h1 class="page-title">
            Family Management
        </h1>


        <!-- ============================= -->
        <!-- FAMILY FORM -->
        <!-- ============================= -->

        <div class="form-card">

            <h2>Add / Update Family</h2>


            <form id="familyForm">


                <!-- Hidden Family ID -->

                <input type="hidden" id="familyId">


                <!-- Family Name -->

                <div class="form-group">

                    <label for="familyName">
                        Family Name
                    </label>

                    <input
                        type="text"
                        id="familyName"
                        required
                    >

                </div>


                <!-- Headcount -->

                <div class="form-group">

                    <label for="headcount">
                        Headcount
                    </label>

                    <input
                        type="number"
                        id="headcount"
                        min="1"
                        required
                    >

                </div>


                <!-- Camp Name -->

                <div class="form-group">

                    <label for="campId">
                        Camp Name
                    </label>

                    <select id="campId" required>

                        <option value="">
                            Select Camp
                        </option>

                    </select>

                </div>


                <!-- Save Button -->

                <button
                    type="submit"
                    class="button primary-button">

                    Save Family

                </button>


                <!-- Clear Button -->

                <button
                    type="button"
                    class="button secondary-button"
                    onclick="clearForm()">

                    Clear

                </button>


                <!-- Message -->

                <p
                    id="message"
                    class="message">
                </p>


            </form>

        </div>


        <!-- ============================= -->
        <!-- FAMILY TABLE -->
        <!-- ============================= -->

        <div class="table-card">

            <h2>Family List</h2>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Family Name</th>

                        <th>Headcount</th>

                        <th>Camp Name</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="familyTableBody">

                </tbody>

            </table>

        </div>


    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="../js/family.js"></script>


</body>

</html>
