<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Supply Distribution</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>


    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="../index.html" class="logo">
                Relief Camp Management
            </a>


            <div class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="camps.html">
                    Camps
                </a>

                <a href="family.html">
                    Families
                </a>

                <a href="supplies.html">
                    Supplies
                </a>

                <a href="distribution.html" class="active">
                    Distribution
                </a>

            </div>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="page-container">


        <a href="../index.html" class="back-link">
            ← Back to Dashboard
        </a>


        <h1 class="page-title">
            Supply Distribution
        </h1>


        <!-- ============================= -->
        <!-- DISTRIBUTION FORM -->
        <!-- ============================= -->

        <div class="form-card">

            <h2>Distribute Supply</h2>


            <form id="distributionForm">


                <!-- Camp -->

                <div class="form-group">

                    <label for="distributionCampId">
                        Camp Name
                    </label>

                    <select
                        id="distributionCampId"
                        required>

                        <option value="">
                            Select Camp
                        </option>

                    </select>

                </div>


                <!-- Family -->

                <div class="form-group">

                    <label for="distributionFamilyId">
                        Family Name
                    </label>

                    <select
                        id="distributionFamilyId"
                        required>

                        <option value="">
                            Select Family
                        </option>

                    </select>

                </div>


                <!-- Supply -->

                <div class="form-group">

                    <label for="distributionSupplyId">
                        Supply Item
                    </label>

                    <select
                        id="distributionSupplyId"
                        required>

                        <option value="">
                            Select Supply
                        </option>

                    </select>

                </div>


                <!-- Quantity -->

                <div class="form-group">

                    <label for="distributionQuantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="distributionQuantity"
                        min="1"
                        required>

                </div>


                <!-- Buttons -->

                <button
                    type="submit"
                    class="button primary-button">

                    Distribute Supply

                </button>


                <button
                    type="button"
                    class="button secondary-button"
                    onclick="clearDistributionForm()">

                    Clear

                </button>


                <!-- Message -->

                <p
                    id="message"
                    class="message">
                </p>


            </form>

        </div>


        <!-- ============================= -->
        <!-- DISTRIBUTION HISTORY -->
        <!-- ============================= -->

        <div class="table-card">

            <h2>Distribution History</h2>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Camp Name</th>

                        <th>Family Name</th>

                        <th>Supply Item</th>

                        <th>Quantity</th>

                    </tr>

                </thead>


                <tbody id="distributionTableBody">

                </tbody>

            </table>

        </div>


    </main>


    <script src="../js/distribution.js"></script>

</body>

</html>
